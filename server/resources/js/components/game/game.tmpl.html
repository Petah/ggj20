<div class="g-game">
    <div class="g-floor"></div>
    <g-level-select></g-level-select>
    <div class="g-game-wrapper">
        <div class="g-game-left">
            <g-score ng-show="$ctrl.level" class="d-inline-block"></g-score>
            <div class="text-center">
                <button type="button" class="btn btn-primary" onclick="location.reload()">Reload</button>
            </div>
            <g-palette g-on-color-change="$ctrl.onPaletteColorChange(color)" ng-show="$ctrl.level"></g-palette>
        </div>
        <div class="g-game-right">
            <g-canvas g-brush="$ctrl.brush" g-on-start-stroke="$ctrl.onBrushStartStroke(point)"
                g-on-continue-stroke="$ctrl.onBrushContinueStroke(canvas, context, point)"
                g-on-end-stroke="$ctrl.onBrushEndStroke(event)" ng-show="$ctrl.level"></g-canvas>
        </div>
    </div>
</div>

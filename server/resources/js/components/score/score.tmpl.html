<div class="g-score">
    <div class="text-center" ng-show="!$ctrl.timeUp">
        <div class="g-score-clock">
            <div class="g-score-clock-background">88:88</div>
            <div class="g-score-clock-foreground">{{ $ctrl.timeRemainingFormatted }}</div>
        </div>
        <!-- <div>{{ $ctrl.score }} {{ $ctrl.realScore }}</div> -->
        <div class="g-score-gauge">
            <div class="g-score-gauge-arrow" ng-style="{transform: $ctrl.getArrowRotation()}">
            </div>
            <div class="g-score-gauge-stop" ng-click="$ctrl.stop()">
            </div>
        </div>
    </div>

    <div class="modal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <h1 ng-show="$ctrl.score > 1000">Well done!</h1>
                    <h1 ng-show="$ctrl.score < 1000 && $ctrl.score > -1000">Nice try!</h1>
                    <h1 ng-show="$ctrl.score < -1000">Bad luck!</h1>
                    <div>
                        You scored {{ $ctrl.score }}!
                        <div class="progress" ng-show="$ctrl.submittingScore && !$ctrl.submittedScore">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 100%"></div>
                        </div>

                        <div class="input-group mb-3" ng-show="!$ctrl.submittingScore && !$ctrl.submittedScore">
                            <input type="text" class="form-control mr-4" placeholder="Your name..." ng-model="$ctrl.playerName">
                            <div class="input-group-append">
                                <button class="btn btn-primary g-btn-bg" type="button" ng-click="$ctrl.submitScore()">Submit score</button>
                            </div>
                        </div>
                    </div>
                    <h3>
                        High scores
                    </h3>
                    <div>
                        <table class="table table-sm">
                            <tr ng-repeat="highScore in $ctrl.highScores">
                                <td>{{ highScore.attributes.playerName }}</td>
                                <td class="g-number">{{ highScore.attributes.timeAgo }}</td>
                                <td class="g-number">{{ highScore.attributes.score }}</td class="g-number">
                            </tr>
                        </table>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-primary g-btn-bg" onclick="location.reload()">Try again</button>
                    </div>
                </div>
            </div>
            <img draggable="false" class="g-clippy" src="/images/clippy.png" />
        </div>
    </div>
</div>
